
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Regression Grades</title>
</head>
<body>

    <h1>Linear Regression: Caculate grades depends on study hours</h1>

    <form method="post">
        <label for = "hours">Study Hours:</label>
        <input required type="number" name="hours">
        <button type="submit"> Predict</button>
    </form>

    {% if result is not none %}
    <h2>Estimated Grade: {{ result }}</h2>
    {% endif %}
    
</body>
</html>
